<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Coast Spas — Prijslijst 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a2332;-webkit-text-size-adjust:100%;}

/* TOP BAR */
.topbar{background:linear-gradient(135deg,#1a2332 0%,#2c3e55 100%);color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.cs-logo{height:36px;width:auto;}
.tbtitle{font-size:15px;font-weight:700;letter-spacing:0.02em;}
.tbsub{font-size:11px;opacity:0.7;margin-top:1px;}
.cart-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:10px;color:white;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit;backdrop-filter:blur(4px);}
.cart-btn:active{background:rgba(255,255,255,0.25);}
.cart-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2;}
.badge{background:#00a8e8;color:white;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center;}

/* FILTER */
.filter-wrap{background:white;border-bottom:1px solid #dde3ea;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.filter-btn{display:inline-block;background:transparent;border:1px solid #c8d0da;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:#5a6a7e;margin-right:6px;font-family:inherit;white-space:nowrap;transition:all 0.15s;}
.filter-btn:hover{background:#f0f4f8;color:#1a2332;}
.filter-btn.active{background:#1a2332;color:white;border-color:#1a2332;}

/* MAIN */
.main{padding:14px 12px 120px;}

/* SECTION */
.section{margin-bottom:16px;background:white;border-radius:14px;border:1px solid #dde3ea;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#5a6a7e;padding:11px 16px;background:linear-gradient(135deg,#f8fafc,#f0f4f8);border-bottom:1px solid #dde3ea;}

/* CARD GRID for models with images */
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.model-card{border-right:1px solid #f0f4f8;border-bottom:1px solid #f0f4f8;padding:12px;cursor:pointer;transition:background 0.1s;-webkit-tap-highlight-color:transparent;position:relative;}
.model-card:nth-child(2n){border-right:none;}
.model-card:hover{background:#f8fafc;}
.model-card.selected{background:#e8f4ff;}
.model-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#f0f4f8;display:block;margin-bottom:8px;}
.model-img-placeholder{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#e8edf3,#d4dce6);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.model-img-placeholder svg{width:40px;height:40px;opacity:0.3;}
.check-badge{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:6px;border:2px solid #c8d0da;background:white;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.model-card.selected .check-badge{background:#00a8e8;border-color:#00a8e8;}
.check-badge svg{width:13px;height:13px;stroke:white;fill:none;stroke-width:3;display:none;}
.model-card.selected .check-badge svg{display:block;}
.model-name{font-size:12px;font-weight:600;color:#1a2332;line-height:1.3;margin-bottom:3px;}
.model-jets{font-size:11px;color:#7a8a9e;margin-bottom:5px;}
.model-price{font-size:14px;font-weight:700;color:#1a2332;}
.model-price.alt{color:#00a8e8;}
.qty-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qty-btn{width:24px;height:24px;border-radius:5px;background:#f0f4f8;border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a2332;line-height:1;font-family:inherit;}
.qty-btn:active{background:#dde3ea;}
.qty-num{font-size:12px;font-weight:700;min-width:16px;text-align:center;color:#1a2332;}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;opacity:0;transition:opacity 0.25s;}
.drawer-overlay.open{display:block;opacity:1;}
.drawer{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,0.2);}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:#dde3ea;border-radius:2px;margin:12px auto 0;}
.drawer-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f4f8;}
.drawer-head h2{font-size:17px;font-weight:700;color:#1a2332;}
.drawer-close{background:none;border:none;font-size:24px;color:#9aabb8;cursor:pointer;padding:0 4px;line-height:1;}
.drawer-clear{font-size:13px;color:#cc3333;background:none;border:none;cursor:pointer;font-family:inherit;}
.drawer-items{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.drawer-empty{padding:40px 20px;text-align:center;color:#9aabb8;font-size:14px;line-height:1.7;}
.ci{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #f5f8fa;}
.ci:last-child{border-bottom:none;}
.ci-img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#f0f4f8;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:600;color:#1a2332;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-sub{font-size:11px;color:#9aabb8;margin-top:2px;}
.ci-right{text-align:right;flex-shrink:0;}
.ci-price{font-size:13px;font-weight:700;color:#1a2332;}
.ci-qp{font-size:11px;color:#9aabb8;margin-top:1px;}
.ci-rm{background:none;border:none;color:#dde3ea;font-size:22px;line-height:1;cursor:pointer;padding:0 2px;flex-shrink:0;}
.ci-rm:active{color:#cc3333;}

/* FOOTER */
.drawer-foot{border-top:1px solid #dde3ea;padding:14px 18px;background:#fafbfc;}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.total-label{font-size:15px;font-weight:600;color:#1a2332;}
.total-val{font-size:22px;font-weight:800;color:#00a8e8;}
.btn-mail{width:100%;background:linear-gradient(135deg,#1a2332,#2c3e55);color:white;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(26,35,50,0.3);}
.btn-mail:disabled{background:#c8d0da;box-shadow:none;cursor:default;}
.btn-mail svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:2;}

/* MAIL MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;padding:22px 18px 36px;max-height:85vh;overflow-y:auto;}
.modal h3{font-size:18px;font-weight:700;color:#1a2332;margin-bottom:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:#5a6a7e;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.06em;}
.field input,.field textarea{width:100%;border:1.5px solid #c8d0da;border-radius:10px;padding:12px;font-size:15px;font-family:inherit;color:#1a2332;background:white;outline:none;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:#00a8e8;}
.field textarea{height:90px;resize:none;}
.modal-btns{display:flex;gap:10px;margin-top:18px;}
.btn-cancel{flex:1;background:#f0f4f8;color:#1a2332;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-send{flex:2;background:linear-gradient(135deg,#1a2332,#2c3e55);color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>

    </div>
  </div>
  <div class="drawer-items" id="drawer-items"></div>
  <div class="drawer-foot">

    </button>
  </div>
</div>

      <button class="btn-cancel" onclick="closeMailModal()">Annuleren</button>

    </div>
  </div>
</div>

function getP(id){ return PRODUCTS.find(p=>uid(p)===id); }

function imgUrl(p){

    ps.forEach(p => {
      const id = uid(p);
      const variant = p[5] ? `<span style="background:#e8f0f8;color:#4a6080;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;margin-right:3px">${p[5]}</span>` : "";
      h += `<div class="model-card" data-uid="${id}" onclick="toggle('${id}')">
        <div class="check-badge"><svg viewBox="0 0 12 10"><polyline points="1,5 4,9 11,1"/></svg></div>
        <img class="model-img" src="${imgUrl(p)}" alt="${p[1]}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="model-img-placeholder" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><ellipse cx="12" cy="13" rx="7" ry="8"/><rect x="9" y="4" width="6" height="3" rx="1.5"/></svg>
        </div>
        <div class="model-name">${p[1]}</div>
        <div class="model-jets">${p[2]} jets</div>
        <div class="model-price">${fmt(p[3])}</div>
        <div class="qty-row" id="qc_${id}" style="display:none" onclick="event.stopPropagation()">
          <button class="qty-btn" onclick="chQty('${id}',-1)">−</button>
          <span class="qty-num" id="qn_${id}">1</span>
          <button class="qty-btn" onclick="chQty('${id}',1)">+</button>
        </div>
      </div>`;
    });
    h += "</div>";
    sec.innerHTML = h;
    c.appendChild(sec);
  });
}

function toggle(id){
  const el = document.querySelector(`.model-card[data-uid="${id}"]`);
  const qc = document.getElementById("qc_"+id);
  if(cart[id]){ delete cart[id]; el.classList.remove("selected"); qc.style.display="none"; }
  else{ cart[id]=1; el.classList.add("selected"); qc.style.display="flex"; }
  renderCart();
}

function chQty(id,d){
  if(!cart[id]) return;
  cart[id] = Math.max(1, cart[id]+d);
  document.getElementById("qn_"+id).textContent = cart[id];
  renderCart();
}

function clearCart(){
  Object.keys(cart).forEach(id=>{
    delete cart[id];
    const el = document.querySelector(`.model-card[data-uid="${id}"]`);
    if(el) el.classList.remove("selected");
    const qc = document.getElementById("qc_"+id); if(qc) qc.style.display="none";
    const qn = document.getElementById("qn_"+id); if(qn) qn.textContent="1";
  });
  renderCart();
}

function renderCart(){
  const ids = Object.keys(cart);
  const totalQty = ids.reduce((s,id)=>s+cart[id],0);
  document.getElementById("cart-badge").textContent = totalQty;
  const total = ids.reduce((s,id)=>{ const p=getP(id); return p?s+p[3]*cart[id]:s; },0);
  document.getElementById("drawer-total").textContent = fmt(total);
  document.getElementById("btn-mail").disabled = ids.length===0;

  const di = document.getElementById("drawer-items");
  if(!ids.length){
    di.innerHTML = `<div class="drawer-empty">Nog geen modellen geselecteerd.<br>Tik op een model in de lijst.</div>`;
    return;
  }
  di.innerHTML = ids.map(id=>{
    const p = getP(id); if(!p) return "";
    const qty = cart[id]; const sub = p[3]*qty;
    return `<div class="ci">
      <img class="ci-img" src="${imgUrl(p)}" alt="" loading="lazy" onerror="this.style.background='#e8edf3'">
      <div class="ci-info">
        <div class="ci-name">${p[1]}</div>
        <div class="ci-sub">${p[2]} jets · ${LABELS[p[0]]}</div>
      </div>
      <div class="ci-right">
        <div class="ci-price">${fmt(sub)}</div>
        ${qty>1?`<div class="ci-qp">${qty} × ${fmt(p[3])}</div>`:""}
      </div>
      <button class="ci-rm" onclick="toggle('${id}')">×</button>
    </div>`;
  }).join("");
}

function filter(cat,btn){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".section").forEach(s=>s.style.display=(cat==="all"||s.dataset.cat===cat)?"block":"none");
}

function openDrawer(){ document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); document.body.style.overflow="hidden"; }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); document.body.style.overflow=""; }
function openMailModal(){ document.getElementById("mail-modal").classList.add("open"); }
function closeMailModal(){ document.getElementById("mail-modal").classList.remove("open"); }

function sendMail(){
  const ids = Object.keys(cart);
  const now = new Date().toLocaleDateString("nl-NL",{day:"2-digit",month:"long",year:"numeric"});
  const name = document.getElementById("mail-from-name").value.trim();
  const note = document.getElementById("mail-note").value.trim();
  const to = document.getElementById("mail-to").value.trim();
  let body = "Coast Spas — Mijn selectie\n";
  body += "Prijslijst 2026 | "+now+"\n";
  if(name) body += "Samengesteld door: "+name+"\n";
  if(note) body += "\nOpmerking: "+note+"\n";
  body += "\n";
  body += "MODEL                                        JETS   AANTAL         PRIJS\n";
  body += "-------------------------------------------------------------------------\n";
  let total = 0;
  ids.forEach(id=>{
    const p = getP(id); if(!p) return;
    const qty = cart[id]; const sub = p[3]*qty; total += sub;
    const nm = p[1].substring(0,42).padEnd(42);
    const jets = String(p[2]+" jets").padEnd(6);
    body += nm+" "+jets+" "+String(qty).padStart(6)+"  "+fmt(sub).padStart(12)+"\n";
  });
  body += "-------------------------------------------------------------------------\n";
  body += "TOTAAL INCL. BTW".padEnd(58)+fmt(total).padStart(12)+"\n";
  body += "\nPrijzen onder voorbehoud | coastspas.com";
  window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent("Coast Spas — Mijn selectie 2026")}&body=${encodeURIComponent(body)}`;
  closeMailModal();
}

buildList();
renderCart();
</script>
