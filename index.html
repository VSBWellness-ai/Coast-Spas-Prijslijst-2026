<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Coast Spas — Prijslijst 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a2332;-webkit-text-size-adjust:100%;}
.topbar{background:linear-gradient(135deg,#1a2332,#2c3e55);color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.tbtitle{font-size:15px;font-weight:700;}
.tbsub{font-size:11px;opacity:.7;margin-top:1px;}
.cart-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:white;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit;}
.cart-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2;}
.badge{background:#00a8e8;color:white;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center;}
.filter-wrap{background:white;border-bottom:1px solid #dde3ea;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;padding:10px 12px;}
.filter-btn{display:inline-block;background:transparent;border:1px solid #c8d0da;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:#5a6a7e;margin-right:6px;font-family:inherit;}
.filter-btn.active{background:#1a2332;color:white;border-color:#1a2332;}
.main{padding:14px 12px 120px;}
.section{margin-bottom:16px;background:white;border-radius:14px;border:1px solid #dde3ea;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#5a6a7e;padding:11px 16px;background:#f8fafc;border-bottom:1px solid #dde3ea;}
.model-grid{display:grid;grid-template-columns:1fr 1fr;}
.model-card{border-right:1px solid #f0f4f8;border-bottom:1px solid #f0f4f8;padding:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;transition:background .1s;}
.model-card:nth-child(2n){border-right:none;}
.model-card.selected{background:#e8f4ff;}
.model-img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:#f5f7fa;display:block;margin-bottom:8px;}
.model-img.portrait{aspect-ratio:2/3;}
.check-badge{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:6px;border:2px solid #c8d0da;background:white;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .15s;}
.model-card.selected .check-badge{background:#00a8e8;border-color:#00a8e8;}
.check-badge svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:3;display:none;}
.model-card.selected .check-badge svg{display:block;}
.model-name{font-size:12px;font-weight:600;color:#1a2332;line-height:1.3;margin-bottom:2px;}
.model-variant{display:inline-block;background:#e8f0f8;color:#4a6080;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;margin-bottom:4px;}
.model-jets{font-size:11px;color:#7a8a9e;margin-bottom:4px;}
.model-price{font-size:14px;font-weight:700;color:#1a2332;}
.qty-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qty-btn{width:24px;height:24px;border-radius:5px;background:#f0f4f8;border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a2332;font-family:inherit;}
.qty-num{font-size:12px;font-weight:700;min-width:16px;text-align:center;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.2);}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:#dde3ea;border-radius:2px;margin:12px auto 0;}
.drawer-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f4f8;}
.drawer-head h2{font-size:17px;font-weight:700;}
.drawer-close{background:none;border:none;font-size:24px;color:#9aabb8;cursor:pointer;line-height:1;}
.drawer-clear{font-size:13px;color:#cc3333;background:none;border:none;cursor:pointer;font-family:inherit;}
.drawer-items{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.drawer-empty{padding:40px 20px;text-align:center;color:#9aabb8;font-size:14px;line-height:1.7;}
.ci{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #f5f8fa;}
.ci:last-child{border-bottom:none;}
.ci-img{width:48px;height:48px;border-radius:6px;object-fit:contain;background:#f5f7fa;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-sub{font-size:11px;color:#9aabb8;margin-top:2px;}
.ci-right{text-align:right;flex-shrink:0;}
.ci-price{font-size:13px;font-weight:700;}
.ci-qp{font-size:11px;color:#9aabb8;margin-top:1px;}
.ci-rm{background:none;border:none;color:#dde3ea;font-size:22px;line-height:1;cursor:pointer;padding:0 2px;flex-shrink:0;}
.drawer-foot{border-top:1px solid #dde3ea;padding:14px 18px;background:#fafbfc;}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.total-label{font-size:15px;font-weight:600;}
.total-val{font-size:22px;font-weight:800;color:#00a8e8;}
.btn-mail{width:100%;background:linear-gradient(135deg,#1a2332,#2c3e55);color:white;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-mail:disabled{background:#c8d0da;cursor:default;}
.btn-mail svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:2;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;padding:22px 18px 36px;max-height:85vh;overflow-y:auto;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:#5a6a7e;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
.field input,.field textarea{width:100%;border:1.5px solid #c8d0da;border-radius:10px;padding:12px;font-size:15px;font-family:inherit;color:#1a2332;background:white;outline:none;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:#00a8e8;}
.field textarea{height:90px;resize:none;}
.modal-btns{display:flex;gap:10px;margin-top:18px;}
.btn-cancel{flex:1;background:#f0f4f8;color:#1a2332;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-send{flex:2;background:linear-gradient(135deg,#1a2332,#2c3e55);color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="tbtitle">Coast Spas — Prijslijst 2026</div><div class="tbsub">Tik op een model om te selecteren</div></div>
  <button class="cart-btn" onclick="openDrawer()">
    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Selectie <span class="badge" id="cart-badge">0</span>
  </button>
</div>
<div class="filter-wrap">
  <button class="filter-btn active" onclick="filter('all',this)">Alles</button>
  <button class="filter-btn" onclick="filter('classic',this)">Classic</button>
  <button class="filter-btn" onclick="filter('elite',this)">Elite</button>
  <button class="filter-btn" onclick="filter('luxury',this)">Luxury</button>
  <button class="filter-btn" onclick="filter('opulence',this)">Opulence</button>
  <button class="filter-btn" onclick="filter('swimspa',this)">Swim Spas</button>
</div>
<div class="main" id="sc"></div>
<div class="drawer-overlay" id="dov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-head">
    <h2>Mijn selectie</h2>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="drawer-clear" onclick="clearCart()">Wis alles</button>
      <button class="drawer-close" onclick="closeDrawer()">&#215;</button>
    </div>
  </div>
  <div class="drawer-items" id="di"></div>
  <div class="drawer-foot">
    <div class="total-row"><span class="total-label">Totaal incl. btw</span><span class="total-val" id="dt">&#8364; 0</span></div>
    <button class="btn-mail" id="bm" onclick="openMail()" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Mailen
    </button>
  </div>
</div>
<div class="modal-overlay" id="mm">
  <div class="modal">
    <h3>Selectie mailen</h3>
    <div class="field"><label>Aan (e-mailadres)</label><input type="email" id="mto" placeholder="naam@voorbeeld.nl" inputmode="email"></div>
    <div class="field"><label>Naam afzender (optioneel)</label><input type="text" id="mfn" placeholder="Je naam"></div>
    <div class="field"><label>Opmerking (optioneel)</label><textarea id="mnote" placeholder="Bijv. offerte aanvraag..."></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeMail()">Annuleren</button>
      <button class="btn-send" onclick="sendMail()">Openen in Mail &#8594;</button>
    </div>
  </div>
</div>

      const port=p[6]?" portrait":"";
      const vb=p[5]?`<div class="model-variant">${p[5]}</div>`:"";
      h+=`<div class="model-card" data-uid="${id}" onclick="tog('${id}')">
        <div class="check-badge"><svg viewBox="0 0 12 10"><polyline points="1,5 4,9 11,1"/></svg></div>
        <img class="model-img${port}" src="${IMGS[p[4]]}" alt="${p[1]}" loading="lazy">
        ${vb}<div class="model-name">${p[1]}</div>
        <div class="model-jets">${p[2]} jets</div>
        <div class="model-price">${fmt(p[3])}</div>
        <div class="qty-row" id="qc_${id}" style="display:none" onclick="event.stopPropagation()">
          <button class="qty-btn" onclick="cq('${id}',-1)">\u2212</button>
          <span class="qty-num" id="qn_${id}">1</span>
          <button class="qty-btn" onclick="cq('${id}',1)">+</button>
        </div></div>`;
    });
    h+="</div>";sec.innerHTML=h;c.appendChild(sec);
  });
}
function tog(id){
  const el=document.querySelector(`.model-card[data-uid="${id}"]`);
  const qc=document.getElementById("qc_"+id);
  if(cart[id]){delete cart[id];el.classList.remove("selected");qc.style.display="none";}
  else{cart[id]=1;el.classList.add("selected");qc.style.display="flex";}
  rc();
}
function cq(id,d){
  if(!cart[id])return;
  cart[id]=Math.max(1,cart[id]+d);
  document.getElementById("qn_"+id).textContent=cart[id];
  rc();
}
function clearCart(){
  Object.keys(cart).forEach(id=>{
    delete cart[id];
    const el=document.querySelector(`.model-card[data-uid="${id}"]`);
    if(el)el.classList.remove("selected");
    const qc=document.getElementById("qc_"+id);if(qc)qc.style.display="none";
    const qn=document.getElementById("qn_"+id);if(qn)qn.textContent="1";
  });
  rc();
}
function rc(){
  const ids=Object.keys(cart);
  document.getElementById("cart-badge").textContent=ids.reduce((s,id)=>s+cart[id],0);
  const tot=ids.reduce((s,id)=>{const p=gp(id);return p?s+p[3]*cart[id]:s;},0);
  document.getElementById("dt").textContent=fmt(tot);
  document.getElementById("bm").disabled=!ids.length;
  const di=document.getElementById("di");
  if(!ids.length){di.innerHTML=`<div class="drawer-empty">Nog geen modellen geselecteerd.<br>Tik op een model in de lijst.</div>`;return;}
  di.innerHTML=ids.map(id=>{
    const p=gp(id);if(!p)return"";
    const qty=cart[id];const sub=p[3]*qty;
    return`<div class="ci">
      <img class="ci-img" src="${IMGS[p[4]]}" alt="">
      <div class="ci-info"><div class="ci-name">${p[1]}${p[5]?" \u2014 "+p[5]:""}</div><div class="ci-sub">${p[2]} jets \u00b7 ${LABELS[p[0]]}</div></div>
      <div class="ci-right"><div class="ci-price">${fmt(sub)}</div>${qty>1?`<div class="ci-qp">${qty} \u00d7 ${fmt(p[3])}</div>`:""}</div>
      <button class="ci-rm" onclick="tog('${id}')">\u00d7</button></div>`;
  }).join("");
}
function filter(cat,btn){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".section").forEach(s=>s.style.display=(cat==="all"||s.dataset.cat===cat)?"block":"none");
}
function openDrawer(){document.getElementById("drawer").classList.add("open");document.getElementById("dov").classList.add("open");document.body.style.overflow="hidden";}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("dov").classList.remove("open");document.body.style.overflow="";}
function openMail(){document.getElementById("mm").classList.add("open");}
function closeMail(){document.getElementById("mm").classList.remove("open");}
function sendMail(){
  const ids=Object.keys(cart);
  const now=new Date().toLocaleDateString("nl-NL",{day:"2-digit",month:"long",year:"numeric"});
  const name=document.getElementById("mfn").value.trim();
  const note=document.getElementById("mnote").value.trim();
  const to=document.getElementById("mto").value.trim();
  let body="Coast Spas \u2014 Mijn selectie\nPrijslijst 2026 | "+now+"\n";
  if(name)body+="Samengesteld door: "+name+"\n";
  if(note)body+="\nOpmerking: "+note+"\n";
  body+="\n";
  let tot=0;
  ids.forEach(id=>{
    const p=gp(id);if(!p)return;
    const qty=cart[id];const sub=p[3]*qty;tot+=sub;
    body+=p[1]+(p[5]?" ("+p[5]+")")+" | "+p[2]+" jets | "+qty+"x | "+fmt(sub)+"\n";
  });
  body+="\nTOTAAL INCL. BTW: "+fmt(tot)+"\n\nPrijzen onder voorbehoud | coastspas.com";
  window.location.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent("Coast Spas \u2014 Mijn selectie 2026")+"&body="+encodeURIComponent(body);
  closeMail();
}
buildList();rc();
</script>
